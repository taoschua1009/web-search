[project]
name = "ai-agent-assignment-1"
version = "1.0.0"
description = "AI agent with Gmail, Calendar and company-research tools"
readme = "README.md"
requires-python = ">=3.12"
# Direct dependencies with their minimum versions. uv.lock pins the exact, tested set
# (including transitive packages); requirements.txt is exported from it.
dependencies = [
    "markitdown>=0.0.1",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.7.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "httplib2>=0.22.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "urllib3>=1.26.18,<3",
    "pyOpenSSL>=23.3.0",
    "cryptography>=41.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",  # FastAPI TestClient
    "ruff>=0.5",
]

[tool.uv]
package = false  # an application, not an installable library
default-groups = ["dev"]
