name: read_file
description: 'Read a local file and convert its content to Markdown. Supports many formats: PDF, DOCX,
  XLSX, PPTX, images, text files, and more. Provide the full file path.'
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: The full path to the local file to read.
  required:
  - file_path
required_scopes:
- drive:read
