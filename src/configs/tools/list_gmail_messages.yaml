name: list_gmail_messages
description: List Gmail headers/previews only, when the user only wants a list. For reading or summarizing
  contents, prefer search_and_read_gmail_messages instead. Find Gmail emails using Gmail search syntax.
  Returns message IDs, sender, subject, date, snippets, unread status, next_page_token and per-email errors.
  Defaults to inbox. Use is:unread, from:someone@example.com, subject:invoice, newer_than:7d, etc. Snippets
  are previews; call read_gmail_message for the actual email body. For another page, reuse the query and
  pass next_page_token as page_token.
input_schema:
  type: object
  properties:
    query:
      type: string
      description: Gmail search query; default in:inbox.
    max_results:
      type: integer
      minimum: 1
      maximum: 20
      description: Page size, 1–20; default 10.
    page_token:
      type: string
      description: Continuation token from a previous search.
  required: []
required_scopes:
- gmail:read
