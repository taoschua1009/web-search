name: list_calendar_events
description: List the user's Google Calendar events (title, start, end, location) from a start date for
  a number of days. Use this to see what is already scheduled.
input_schema:
  type: object
  properties:
    start_date:
      type: string
      description: Start date in YYYY-MM-DD. Defaults to today.
    days:
      type: integer
      description: Number of days to list (default 1).
  required: []
required_scopes:
- calendar:read
risk: low
untrusted_output: true
