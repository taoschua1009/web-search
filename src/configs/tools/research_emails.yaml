name: research_emails
description: >-
  Research companies in emails and create full cited reports using the existing multi-agent
  workflow: Email, Web Research, Company Info, Calendar, Memory, Report Generation, Human Approval.
  REQUIRED for requests to research/investigate emails or companies and write a report
  (including Vietnamese "nghiên cứu ... mail ... viết báo cáo"). This is more than
  summarizing email bodies. For the latest N emails call directly with latest_count=N;
  do not list/read them first. Alternatively pass known message_ids. Uses the signed-in
  web user's Gmail and configured research providers. Research covers company profiles,
  products/pricing, leaders, scale/financials, customers/partners/projects, public social
  profiles, recent news and adverse information across multiple domains. A Search Agent searches the web and
  reads pages to build a dashboard-style report page (briefing_url) for all companies. Returns highlights,
  limitations, report URLs, and unresolved company identities. If unresolved, ask the user to provide
  the website; never guess a domain. selections websites must literally appear in the
  user's current message. Does not send/trash mail or create events. One batch per turn.
input_schema:
  type: object
  additionalProperties: false
  properties:
    latest_count:
      type: integer
      minimum: 1
      maximum: 20
      description: Latest matching email count; default 2, ignored with message_ids.
    query:
      type: string
      maxLength: 500
      description: Gmail search query; default in:inbox.
    message_ids:
      type: array
      maxItems: 20
      items:
        type: string
    selections:
      type: array
      maxItems: 20
      description: Websites explicitly supplied in the user's current message.
      items:
        type: object
        additionalProperties: false
        properties:
          message_id:
            type: string
          name:
            type: string
          website:
            type: string
        required: [message_id, name, website]
    timezone:
      type: string
      description: User timezone; default Asia/Ho_Chi_Minh.
    duration_minutes:
      type: integer
      minimum: 5
      maximum: 480
  required: []
required_scopes:
- gmail:read
risk: medium
untrusted_output: true
